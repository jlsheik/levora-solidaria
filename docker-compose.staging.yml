# Staging zero-custo (Fase 61) — Docker + Cloudflare Tunnel.
#
# Preserva ao máximo a arquitetura validada nas Fases 58/59
# (nginx same-origin + proxy /_api/* + Express compilado + scheduler +
# PostgreSQL gerenciado-depois-um-dia, aqui substituído por um
# container Postgres local com volume persistente). Não é produção —
# ver docs/STAGING_ZERO_COST.md para o que muda quando houver
# investimento (migração para deploy/nginx.conf + deploy/levora-api.service
# reais, já documentados e nunca apagados).
#
# Nenhum serviço aqui depende de conta, cartão ou billing de provedor
# pago. O `cloudflared` roda como processo separado no host (não neste
# compose), usando Quick Tunnel (gratuito, sem conta) — ver
# docs/STAGING_ZERO_COST.md seção E.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: staging_only_not_real
      POSTGRES_DB: levora_staging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - levora_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:staging_only_not_real@postgres:5432/levora_staging"
      JWT_SECRET: "${STAGING_JWT_SECRET:?defina STAGING_JWT_SECRET antes de subir o staging}"
      PORT: "3001"
      TRUST_PROXY: "1"
      STORAGE_LOCAL_DIR: "storage/uploads"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - levora_staging_net

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - app
    networks:
      - levora_staging_net

networks:
  levora_staging_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
