name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: levora
          POSTGRES_PASSWORD: levora
          POSTGRES_DB: levora_solidaria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://levora:levora@localhost:5432/levora_solidaria_test
      JWT_SECRET: ci-only-secret-not-for-production-use-please
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
