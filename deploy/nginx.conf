# Config nginx de referência para a Levora Solidária — arquitetura decidida
# na Fase 56 e validada de verdade (container Linux real) na Fase 58:
# nginx same-origin, serve dist/ (SPA) com fallback, faz proxy reverso de
# /_api/* para o Express em 127.0.0.1:<porta> (nunca exposto direto à
# internet), termina TLS. Ver docs/DEPLOYMENT_RUNBOOK.md para o
# procedimento completo e docs/PRODUCTION_READINESS.md para o racional da
# arquitetura.
#
# Este arquivo é referência — ajustar domínio, caminhos de certificado e
# a porta real do Express (EXPRESS_PORT, default 3001, ver .env) antes de
# usar. Nenhum certificado real está incluído aqui.
#
# Este arquivo contém só blocos `server {}` — pressupõe ser incluído pelo
# `nginx.conf` padrão da distro (ex.: via /etc/nginx/sites-enabled/ ou
# conf.d/), que já traz `include mime.types;` por padrão em qualquer
# instalação via pacote (Debian/Ubuntu, imagem oficial `nginx:*`). Achado
# real da Fase 59: usar este arquivo como um `nginx.conf` completo e
# autônomo, sem esse include, faz todo JS servido por `location /` vir
# com `Content-Type: text/plain`, e o navegador recusa executá-lo como
# módulo ES (erro real reproduzido: "Expected a JavaScript-or-Wasm module
# script but the server responded with a MIME type of 'text/plain'" —
# a aplicação carrega em branco). Confirmar sempre, em qualquer instalação
# nova, que `mime.types` está incluído antes de considerar o deploy
# funcional — um `curl -I` nos headers da API não detecta esse problema,
# só abrir a página de verdade no navegador através do nginx real.

# ---------------------------------------------------------------------------
# Separação de responsabilidade dos headers de segurança — decisão única
# (não duplicar, não deixar os dois lados brigarem pelo mesmo header):
#   - Content-Security-Policy, X-Frame-Options, Permissions-Policy,
#     Referrer-Policy, X-Content-Type-Options do DOCUMENTO HTML: nginx,
#     porque só nginx serve o HTML estático (Express nunca serve HTML).
#     O valor do CSP abaixo é DOCUMENT_CSP_WITH_FRAME_ANCESTORS de
#     src/helpers/securityHeaders.ts — nginx não importa TypeScript, então
#     este valor é copiado manualmente; se securityHeaders.ts mudar, este
#     arquivo precisa ser atualizado também (checar nos dois lugares é
#     parte do checklist de deploy, ver DEPLOYMENT_RUNBOOK.md).
#   - Headers da API (/_api/*): já vêm do próprio Express
#     (src/helpers/securityHeaders.ts, API_SECURITY_HEADERS) em toda
#     resposta, inclusive 404 — nginx NÃO duplica nem sobrescreve nada no
#     location /_api/, só repassa.
#   - Strict-Transport-Security (HSTS): só faz sentido com TLS real
#     funcionando nos dois lados (nginx e os clientes); fica no bloco 443,
#     nunca no bloco 80 (que só redireciona).
# ---------------------------------------------------------------------------

# Redireciona todo tráfego HTTP para HTTPS. Nenhum conteúdo real é servido
# aqui.
server {
    listen 80;
    listen [::]:80;
    server_name app.exemplo.org.br;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.exemplo.org.br;

    # Caminhos de referência — substituir pelos certificados reais
    # emitidos externamente (nenhum provedor ACME específico assumido
    # nesta fase; ver DEPLOYMENT_RUNBOOK.md secao "TLS").
    ssl_certificate     /etc/letsencrypt/live/app.exemplo.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.exemplo.org.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /opt/levora-solidaria/dist;
    index index.html;

    # HSTS só com TLS real validado em produção. max-age moderado para o
    # primeiro deploy - pode subir depois de confirmar que HTTPS nunca
    # falha para os usuários reais. Fica no nível do server (não duplica
    # nada do Express, que nunca envia HSTS) — diferente dos headers do
    # DOCUMENTO abaixo, que precisam ficar só nas locations que servem
    # HTML, nunca no nível do server.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Achado real da Fase 59 (requalificação): os headers abaixo (CSP do
    # documento, X-Frame-Options etc.) NÃO podem ficar aqui no nível do
    # server — nginx herda `add_header` do nível do server para qualquer
    # location que não defina o seu próprio, incluindo location /_api/.
    # Isso fazia o proxy devolver DOIS Content-Security-Policy (o do
    # Express, "default-src 'none'", e o do documento por cima,
    # duplicados na mesma resposta) — exatamente o que a separação de
    # responsabilidade no topo deste arquivo diz que nunca deveria
    # acontecer. Corrigido: cada um dos headers do documento agora só
    # existe dentro de `location = /index.html` e `location /` (as duas
    # únicas locations que servem HTML) — nunca mais no nível do server.

    # Proxy reverso para a API Express — único ponto de contato entre
    # nginx e o backend. EXPRESS_PORT deve bater com PORT no .env do
    # processo systemd (default 3001).
    location /_api/ {
        proxy_pass http://127.0.0.1:3001/_api/;
        proxy_http_version 1.1;

        # TRUST_PROXY=1 no Express espera exatamente este hop confiável —
        # nginx é a única camada entre o cliente e o Express, então
        # X-Forwarded-For/X-Real-IP vindos do CLIENTE são substituídos
        # aqui, nunca repassados sem alteração (resistência a spoofing
        # validada de verdade via container Linux + nginx real na Fase
        # 58: 25 requisições com X-Forwarded-For forjado e diferente a
        # cada vez ainda caíram no mesmo bucket de rate limit).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A API é só JSON — nunca cacheamos respostas dela aqui.
        proxy_buffering off;
    }

    # Assets com hash no nome (Vite): imutáveis, cache agressivo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html precisa ser revalidado a cada deploy (é ele que referencia
    # os assets com hash do build atual) — nunca cache longo. Os headers
    # de segurança do DOCUMENTO (ver nota acima) ficam só aqui e em
    # `location /` — nunca no nível do server, para não vazar para
    # location /_api/.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), bluetooth=(), midi=(), picture-in-picture=(), display-capture=(), fullscreen=(), autoplay=(), clipboard-write=(self)" always;
        try_files $uri =404;
    }

    # Fallback de SPA: qualquer rota que não seja um arquivo real cai no
    # index.html, e o React Router decide o que renderizar no cliente —
    # por isso esta location também serve HTML de verdade e precisa dos
    # mesmos headers de documento que `location = /index.html`.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), bluetooth=(), midi=(), picture-in-picture=(), display-capture=(), fullscreen=(), autoplay=(), clipboard-write=(self)" always;
        try_files $uri /index.html;
    }
}
