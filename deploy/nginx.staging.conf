# Nginx do staging zero-custo (Fase 61) — Docker + Cloudflare Tunnel.
#
# Diferenças deliberadas em relação a deploy/nginx.conf (referência de
# produção real, Fases 56-59), todas documentadas em
# docs/STAGING_ZERO_COST.md:
#   - Sem bloco 443/TLS: o Cloudflare Tunnel termina HTTPS na borda:
#     client → Cloudflare (HTTPS) → túnel → aqui (HTTP puro, porta 80,
#     nunca exposta diretamente à internet — só o cloudflared local fala
#     com este container). Nenhum Let's Encrypt duplicando essa função.
#   - `proxy_pass` aponta para o nome do serviço Docker (`app:3001`), não
#     para `127.0.0.1` — os containers não compartilham network namespace.
#   - `worker_processes`/`events`/`include mime.types` explícitos porque
#     este arquivo é o `nginx.conf` inteiro do container (não um
#     fragmento incluído pelo nginx.conf padrão da distro, como é o caso
#     de deploy/nginx.conf) — omitir `mime.types` aqui reproduziria o bug
#     real encontrado na Fase 59 (JS servido como text/plain).
#
# A separação de responsabilidade dos headers do documento (CSP,
# X-Frame-Options etc. só em `location / ` e `location = /index.html`,
# nunca no nível do server, para não vazar para `/_api/`) é a mesma
# correção real da Fase 59 — replicada aqui de propósito.
worker_processes 1;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /_api/ {
      proxy_pass http://app:3001/_api/;
      proxy_http_version 1.1;

      # Cadeia de confiança investigada e comprovada de verdade na Fase 61
      # (ver docs/STAGING_ZERO_COST.md, seção G):
      #   - $remote_addr aqui dentro do container é sempre o IP do
      #     cloudflared local (o gateway da rede Docker), nunca o do
      #     visitante — confirmado via log de diagnóstico.
      #   - CF-Connecting-IP é escrito pela borda da Cloudflare com o IP
      #     real de quem conectou, e NÃO PODE ser forjado pelo cliente:
      #     testado de verdade com `curl -H "CF-Connecting-IP: 6.6.6.6"`
      #     através do túnel real — a borda da Cloudflare devolveu 403
      #     antes mesmo de a requisição chegar aqui.
      #   - X-Forwarded-For, ao contrário, PODE ser definido pelo
      #     cliente — mas a Cloudflare só acrescenta o IP real ao final
      #     da lista (`forjado,IP-real`), nunca substitui; por isso o
      #     valor de entrada de X-Forwarded-For nunca é usado aqui, só
      #     CF-Connecting-IP.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-Proto "https";
      proxy_buffering off;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), bluetooth=(), midi=(), picture-in-picture=(), display-capture=(), fullscreen=(), autoplay=(), clipboard-write=(self)" always;
      try_files $uri =404;
    }

    location / {
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), bluetooth=(), midi=(), picture-in-picture=(), display-capture=(), fullscreen=(), autoplay=(), clipboard-write=(self)" always;
      try_files $uri /index.html;
    }
  }
}
